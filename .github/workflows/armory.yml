name: Armory extension

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust GNU target and build dependencies
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnu
          choco install llvm -y --no-progress
          choco install mingw -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Test diskless library and extension protocol
        run: cargo test --locked --lib --features sliver-extension
      - name: Build Windows amd64 GNU extension
        run: cargo build --locked --release --target x86_64-pc-windows-gnu --lib --features sliver-extension
      - name: Stage DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item target/x86_64-pc-windows-gnu/release/rusthound_ce.dll staging/rusthound-ce-windows-amd64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: rusthound-ce-windows-amd64
          path: staging/rusthound-ce-windows-amd64.dll
          if-no-files-found: error

  package:
    needs: windows-amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rusthound-ce-windows-amd64
          path: staging
      - name: Package Sliver Armory extension
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\([0-9]*\.[0-9]*\.[0-9]*\)"/\1/p' Cargo.toml | head -1)"
          fi
          python3 scripts/package_armory.py --dll staging/rusthound-ce-windows-amd64.dll --version "$version" --out package
          python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          archive = Path('package/rusthound-ce.tar.gz')
          with tarfile.open(archive, 'r:gz') as tar:
              manifest = tar.extractfile('extension.json').read()
              dll = tar.extractfile('dist/rusthound-ce-windows-amd64.dll').read()
          assert manifest == Path('package/extension.json').read_bytes()
          assert json.loads(manifest)['files'][0]['sha256'] == hashlib.sha256(dll).hexdigest()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rusthound-ce-armory-unsigned
          path: |
            package/extension.json
            package/rusthound-ce.tar.gz
          if-no-files-found: error
      - name: Install Minisign
        if: startsWith(github.ref, 'refs/tags/v')
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign package and verify signature
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MINISIGN_PRIVATE_KEY"
          umask 077
          key="$RUNNER_TEMP/rusthound-ce.minisign.key"
          printf '%s' "$MINISIGN_PRIVATE_KEY" > "$key"
          manifest_b64="$(base64 -w 0 package/extension.json)"
          minisign -S -s "$key" -m package/rusthound-ce.tar.gz -x package/rusthound-ce.minisig -t "$manifest_b64"
          rm -f "$key"
          minisign -V -m package/rusthound-ce.tar.gz -x package/rusthound-ce.minisig -P 'RWQ7YBtS7P7ygI6fozXxVcq+Mms0hv5P7jBmYf9VV4AfQMc80NbDbp8n'
          python3 - <<'PY'
          import base64
          from pathlib import Path
          signature = Path('package/rusthound-ce.minisig').read_text().splitlines()
          expected = base64.b64encode(Path('package/extension.json').read_bytes()).decode()
          assert signature[2] == 'trusted comment: ' + expected
          PY
      - name: Publish stable release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" package/rusthound-ce.tar.gz package/rusthound-ce.minisig --clobber && exit 0
            fi
            if gh release create "$GITHUB_REF_NAME" package/rusthound-ce.tar.gz package/rusthound-ce.minisig \
              --title "RustHound CE $GITHUB_REF_NAME" --notes "Diskless Sliver Armory extension for Windows amd64." --latest; then
              exit 0
            fi
            sleep 5
          done
          exit 1
